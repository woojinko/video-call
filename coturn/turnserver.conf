# Local coturn for development. The shared secret is passed on the command line
# (--static-auth-secret) so it isn't committed; it must equal the signaling server's TURN_SECRET.
listening-port=3478
fingerprint
# Time-limited HMAC credentials (coturn REST API), minted by GET /ice-config.
use-auth-secret
realm=video-call.local
# Relay port range. Keep it small locally; open it in the firewall in production.
min-port=49160
max-port=49200
# Plain TURN over UDP/TCP only. Add a cert and turns: (port 5349) for production.
no-tls
no-dtls
no-cli
no-multicast-peers
log-file=stdout
# Never relay into private networks: anyone holding a TURN credential could otherwise reach
# hosts on your LAN through the relay. For single-machine testing, both peers' relay addresses
# are your own LAN IP, so allow exactly that one with --allowed-peer-ip (see README "TURN").
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
