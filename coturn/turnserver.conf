# Local coturn for development. The shared secret is passed on the command line
# (--static-auth-secret) so it isn't committed; it must equal the signaling server's TURN_SECRET.
listening-port=3478
fingerprint
# Time-limited HMAC credentials (coturn REST API), minted by GET /ice-config.
use-auth-secret
realm=video-call.local
# Relay port range. Keep it small locally; open it in the firewall in production.
min-port=49160
max-port=49200
# Plain TURN over UDP/TCP only. Add a cert and turns: (port 5349) for production.
no-tls
no-dtls
no-cli
no-multicast-peers
log-file=stdout
# Production: also deny relaying to private ranges so the relay can't reach your internal network, e.g.
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
